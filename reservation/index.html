<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>resercation Dar Zitoune</title>
</head>
<body>
    
    <h1>Réserver une table au restaurant Dar Zitoune</h1>

    <form action="#" method="post">

        <fieldset>
            <legend>Coordonnées</legend>

            <label for="nom">Nom :</label>
            <input type="text" id="nom" name="nom"
                   minlength="2" required>

            <br><br>

            <label for="email">E-mail :</label>
            <input type="email" id="email" name="email" required>

            <br><br>

            <label for="telephone">Téléphone :</label>
            <input type="tel" id="telephone" name="telephone"
                   pattern="0[567][0-9]{8}"
                   title="10 chiffres commençant par 05, 06 ou 07"
                   required>
        </fieldset>

        <br>

        <fieldset>
            <legend>Réservation</legend>

            <label for="date">Date :</label>
            <input type="date" id="date" name="date" required>

            <br><br>

            <label for="heure">Heure :</label>
            <input type="time" id="heure" name="heure"
                   min="12:00" max="23:00" required>

            <br><br>

            <label for="personnes">Nombre de personnes :</label>
            <input type="number" id="personnes" name="personnes"
                   min="1" max="12" required>

            <br><br>

            <p>Emplacement :</p>

            <input type="radio" id="interieur" name="emplacement"
                   value="interieur" checked>
            <label for="interieur">Salle intérieure</label>

            <input type="radio" id="terrasse" name="emplacement"
                   value="terrasse">
            <label for="terrasse">Terrasse</label>

            <br><br>

            <label for="occasion">Occasion :</label>
            <select id="occasion" name="occasion">
                <option value="">-- Aucune --</option>
                <option value="anniversaire">Anniversaire</option>
                <option value="affaires">Repas d'affaires</option>
                <option value="famille">Fête de famille</option>
            </select>

            <br><br>

            <fieldset>
                <legend>Options</legend>

                <input type="checkbox" id="chaise" name="options[]"
                       value="chaise-bebe">
                <label for="chaise">Chaise bébé</label>

                <br>

                <input type="checkbox" id="fauteuil" name="options[]"
                       value="fauteuil">
                <label for="fauteuil">Accès pour fauteuil roulant</label>

                <br>

                <input type="checkbox" id="vegetarien" name="options[]"
                       value="vegetarien">
                <label for="vegetarien">Menu végétarien</label>
            </fieldset>

            <br>

            <label for="demandes">Demandes particulières :</label>
            <br>
            <textarea id="demandes" name="demandes" rows="4"
                      maxlength="200"
                      placeholder="Vos demandes particulières..."></textarea>

            <br><br>

            <input type="checkbox" id="conditions" name="conditions"
                   required>
            <label for="conditions">
                J'accepte les conditions de réservation
            </label>

            <br><br>

            <button type="submit">Réserver</button>
            <button type="reset">Effacer</button>

        </fieldset>

    </form>
</body>
</html>
